<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Exam Arena — Premium online exam platform">
<title>Exam Arena</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--primary:#4f46e5;--soft:#eef2ff;--good:#12b76a;--bad:#f04438;--warn:#f79009;--shadow:0 12px 35px rgba(16,24,40,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
header{height:68px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;gap:24px;position:sticky;top:0;z-index:20}.logo{font-weight:900;font-size:21px}.logo span{color:var(--primary)}nav{display:flex;gap:6px;flex:1}nav button,.icon{background:transparent;padding:9px 12px;color:var(--muted);border-radius:9px}nav button.active,nav button:hover{background:var(--soft);color:var(--primary)}.mobile{display:none}.container{max-width:1180px;margin:auto;padding:32px 20px}.hero{background:linear-gradient(135deg,#111827,#312e81);color:white;border-radius:24px;padding:42px;box-shadow:var(--shadow)}h1{font-size:42px;line-height:1.05;margin:0 0 12px}.hero p{color:#d0d5dd;max-width:650px}.btn{padding:11px 17px;border-radius:10px;font-weight:750}.primary{background:var(--primary);color:#fff}.white{background:#fff;color:#111827}.ghost{background:var(--soft);color:var(--primary)}.danger{background:#fee4e2;color:#b42318}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:0 5px 18px rgba(16,24,40,.035)}.stat b{font-size:28px;display:block;margin-top:5px}.muted{color:var(--muted);font-size:13px}.section{display:flex;justify-content:space-between;align-items:center;margin:28px 0 13px}.section h2{margin:0}.exam-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tag{display:inline-block;background:var(--soft);color:var(--primary);padding:5px 8px;border-radius:8px;font-size:12px;font-weight:700}.meta{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;color:var(--muted);font-size:13px}.search{display:flex;gap:10px;margin:15px 0}.search input,.search select,input,select{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);outline:none}.search input{flex:1}.actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}.auth{max-width:440px;margin:70px auto}.auth input{width:100%;margin:7px 0}.question{font-size:20px;font-weight:750;margin:18px 0}.option{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);padding:14px;border-radius:12px;margin:9px 0}.option.selected{border-color:var(--primary);background:var(--soft)}.letter{font-weight:900;margin-right:10px;color:var(--primary)}.exam-top{display:flex;justify-content:space-between;align-items:center;gap:15px}.timer{font-weight:900;font-size:22px}.danger-t{color:var(--bad)}.warn{color:var(--warn)}.progress{height:7px;background:var(--line);border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary)}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}.qnum{padding:9px;border-radius:8px;background:var(--bg)}.qnum.answered{background:var(--soft);color:var(--primary)}.qnum.current{outline:2px solid var(--primary)}.qnum.marked{box-shadow:inset 0 -3px 0 var(--warn)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.center{text-align:center}.modal{position:fixed;inset:0;background:rgba(16,24,40,.55);display:grid;place-items:center;z-index:50;padding:20px}.modalbox{max-width:460px;width:100%;background:var(--card);border-radius:18px;padding:25px}.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:12px 17px;border-radius:10px;z-index:100}.notice{padding:12px 15px;border-radius:10px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;margin:15px 0}
body.dark{--bg:#0b1020;--card:#121a2b;--text:#f2f4f7;--muted:#98a2b3;--line:#25304a;--soft:#202b50}body.dark header{background:rgba(18,26,43,.92)}body.dark .hero{background:linear-gradient(135deg,#080d18,#1e1b4b)}
@media(max-width:850px){nav{display:none}.mobile{display:block;margin-left:auto}.grid{grid-template-columns:repeat(2,1fr)}.exam-grid{grid-template-columns:1fr 1fr}h1{font-size:34px}}
@media(max-width:520px){.container{padding:22px 13px}.grid,.exam-grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:15px}.hero{padding:28px}.search{flex-wrap:wrap}.search input{min-width:100%}.actions .btn{padding:10px 12px}.exam-top{align-items:flex-start}.question{font-size:17px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
  <div class="logo">Exam<span>Arena</span></div>
  <nav id="nav"></nav>
  <button class="icon" onclick="toggleTheme()">◐</button>
  <button class="icon mobile" onclick="toggleNav()">☰</button>
</header>
<main id="main"></main>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
/* ================= SUPABASE =================
   Put your Project URL and Publishable/Anon key here.
   NEVER put a service_role/secret key in this file.
*/
const SUPABASE_URL="https://fmworfdgwhwssgutjytz.supabase.co";
const SUPABASE_KEY="sb_publishable_6pGkRV8jfwJi5MdrT_5JTQ_7EtOFdq1";
const sb=(window.supabase && !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_KEY.includes("YOUR_SUPABASE"))
  ? window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

let user=null,profile=null,exams=[],questions=[],attempts=[],page="home";
let exam=null,answers=[],marked=new Set(),idx=0,endAt=0,timer=null,lastResult=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function toast(x){$("toast").textContent=x;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2200)}
function toggleTheme(){document.body.classList.toggle("dark");localStorage.theme=document.body.classList.contains("dark")?"dark":"light"}
if(localStorage.theme==="dark")document.body.classList.add("dark");
function toggleNav(){let n=$("nav");n.style.display=n.style.display==="flex"?"none":"flex"}
function go(p){page=p;render();scrollTo(0,0)}
function modal(title,body,buttons=""){ $("modalbox").innerHTML=`<h3>${title}</h3><div>${body}</div><div class="actions">${buttons}</div>`;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}
function configured(){return !!sb}

async function boot(){
  if(!configured()){render();return}
  const {data}=await sb.auth.getSession(); user=data.session?.user||null;
  if(user) await loadProfile();
  sb.auth.onAuthStateChange(async(_e,session)=>{user=session?.user||null;if(user)await loadProfile();else profile=null;render()});
  await loadData(); render();
}
async function loadProfile(){
  const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(error) console.error(error); profile=data;
}
async function loadData(){
  if(!user)return;
  const e=await sb.from("exams").select("*").or(`published.eq.true,created_by.eq.${user.id}`).order("created_at",{ascending:false});
  if(!e.error)exams=e.data||[];
  const a=await sb.from("attempts").select("*").eq("user_id",user.id).order("submitted_at",{ascending:false});
  if(!a.error)attempts=a.data||[];
}
async function loadQuestions(examId){
  const r=await sb.from("questions").select("id,exam_id,question,options,correct_answer,marks,position").eq("exam_id",examId).order("position");
  if(r.error)throw r.error; questions=r.data||[]; return questions;
}
async function signIn(email,password){
  const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;
}
async function signUp(name,email,password){
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});if(error)throw error;
  if(data.user&&!data.session)toast("Check your email to confirm your account.");
}
async function signOut(){await sb.auth.signOut();go("home")}
async function saveAttempt(){
  if(!user||!exam)return;
  const correct=answers.filter((a,i)=>a!==null&&questions[i]?.correct_answer===a).length;
  const wrong=answers.filter((a,i)=>a!==null&&questions[i]?.correct_answer!==a).length;
  const unanswered=answers.filter(a=>a===null).length;
  const score=correct*Number(exam.marks||1)-wrong*Number(exam.negative_mark||0);
  const r={exam_id:exam.id,user_id:user.id,score,correct,wrong,unanswered,submitted_at:new Date().toISOString()};
  const {data,error}=await sb.from("attempts").insert(r).select().single();if(error)throw error;
  return {...r,id:data?.id,exam_title:exam.title};
}

function nav(){
  if(!user)return "";
  return ["home","exams","results","leaderboard","profile",profile?.role==="admin"?"admin":""].filter(Boolean)
   .map(x=>`<button class="${page===x?"active":""}" onclick="go('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")
}
function authView(){
 return `<div class="container"><div class="card auth"><h2>Welcome to Exam Arena</h2><p class="muted">Login or create an account to continue.</p>
 <div class="notice">Database/Auth is connected. Your exams and attempts will be stored in Supabase.</div>
 <input id="authName" placeholder="Full name (for signup)">
 <input id="authEmail" type="email" placeholder="Email">
 <input id="authPass" type="password" placeholder="Password">
 <div class="actions"><button class="btn ghost" onclick="doSignup()">Create account</button><button class="btn primary" onclick="doSignin()">Login</button></div>
 </div></div>`
}
async function doSignin(){try{await signIn($("authEmail").value,$("authPass").value);toast("Logged in");}catch(e){toast(e.message)}}
async function doSignup(){try{await signUp($("authName").value,$("authEmail").value,$("authPass").value);toast("Account created");}catch(e){toast(e.message)}}

function home(){
 let total=attempts.length, avg=total?Math.round(attempts.reduce((a,x)=>a+Number(x.score||0),0)/total):0;
 return `<div class="container"><section class="hero"><h1>Test your preparation.</h1><p>Real online exams with accounts, cloud-saved attempts and a premium exam experience.</p><button class="btn white" onclick="go('exams')">Explore Exams →</button></section>
 <div class="grid"><div class="card stat"><span class="muted">Available Exams</span><b>${exams.filter(x=>x.published).length}</b></div><div class="card stat"><span class="muted">Completed</span><b>${total}</b></div><div class="card stat"><span class="muted">Average Score</span><b>${avg}</b></div><div class="card stat"><span class="muted">Account</span><b>✓</b></div></div>
 <div class="section"><h2>Latest Exams</h2><button class="btn ghost" onclick="go('exams')">View all</button></div><div class="exam-grid">${exams.filter(x=>x.published).slice(0,3).map(examCard).join("")||`<div class="card">No published exams yet.</div>`}</div></div>`
}
function examCard(e){
 return `<div class="card"><span class="tag">${esc(e.category||"General")}</span><h3>${esc(e.title)}</h3><p class="muted">${esc(e.description||"Online mock test")}</p><div class="meta"><span>📝 ${e.total_marks||e.duration_minutes||0} ${e.total_marks?"marks":"min"}</span><span>⏱ ${e.duration_minutes||0} min</span><span>${esc(e.difficulty||"Medium")}</span></div><button class="btn primary" onclick="startExam(${e.id})">Start Exam</button></div>`
}
function examsView(){
 return `<div class="container"><div class="section"><div><h2>Exams</h2><span class="muted">Choose a published test.</span></div></div>
 <div class="search"><input id="search" oninput="filterExams()" placeholder="Search exams..."><select id="cat" onchange="filterExams()"><option value="">All categories</option>${[...new Set(exams.map(e=>e.category).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
 <div id="examList" class="exam-grid">${exams.filter(x=>x.published).map(examCard).join("")||`<div class="card">No published exams found.</div>`}</div></div>`
}
function filterExams(){let q=($("search").value||"").toLowerCase(),c=$("cat").value;let list=exams.filter(e=>e.published&&(!q||e.title.toLowerCase().includes(q))&&(!c||e.category===c));$("examList").innerHTML=list.map(examCard).join("")||`<div class="card">No matching exams.</div>`}

async function startExam(id){
 if(!user)return go("login");
 exam=exams.find(e=>Number(e.id)===Number(id));if(!exam)return;
 try{await loadQuestions(id);if(!questions.length)return toast("This exam has no questions yet.");
 modal("Ready to begin?",`<b>${esc(exam.title)}</b><br><br>${questions.length} questions · ${exam.duration_minutes} minutes · Negative marking: ${exam.negative_mark||0}`,
 `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="beginExam()">Start Exam</button>`);
 }catch(e){toast(e.message)}
}
function beginExam(){closeModal();answers=Array(questions.length).fill(null);marked=new Set();idx=0;endAt=Date.now()+Number(exam.duration_minutes||10)*60000;page="exam";render();clearInterval(timer);timer=setInterval(tick,1000);tick()}
function tick(){let left=Math.max(0,endAt-Date.now()),sec=Math.ceil(left/1000),el=$("timer");if(el){el.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;el.className="timer "+(sec<=60?"danger-t":sec<=300?"warn":"")}if(left<=0){clearInterval(timer);finish(true)}}
function examUI(){
 let q=questions[idx],answered=answers.filter(x=>x!==null).length;
 return `<div class="container"><div class="exam-top"><div><b>${esc(exam.title)}</b><div class="muted">Question ${idx+1} of ${questions.length}</div></div><div id="timer" class="timer">--:--</div><button class="btn danger" onclick="confirmFinish()">Submit</button></div>
 <div class="progress" style="margin:14px 0 20px"><i style="width:${answered/questions.length*100}%"></i></div><div class="grid" style="grid-template-columns:1fr 280px">
 <div class="card"><span class="tag">Question ${idx+1}</span><div class="question">${esc(q.question)}</div>${(q.options||[]).map((o,i)=>`<button class="option ${answers[idx]===i?"selected":""}" onclick="answer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join("")}<div class="actions"><button class="btn ghost" onclick="prev()">← Previous</button><button class="btn ghost" onclick="mark()">⚑ ${marked.has(idx)?"Marked":"Mark"}</button><button class="btn primary" onclick="next()">Next →</button></div></div>
 <aside class="card"><b>Navigator</b><div class="palette">${questions.map((_,i)=>`<button class="qnum ${i===idx?"current ":""}${answers[i]!==null?"answered ":""}${marked.has(i)?"marked":""}" onclick="jump(${i})">${i+1}</button>`).join("")}</div><div class="muted" style="margin-top:15px">Answered: ${answered} · Remaining: ${questions.length-answered}</div></aside></div></div>`
}
function answer(i){answers[idx]=i;render()} function next(){idx<questions.length-1?(idx++,render()):confirmFinish()} function prev(){if(idx>0){idx--;render()}} function jump(i){idx=i;render()} function mark(){marked.has(idx)?marked.delete(idx):marked.add(idx);render()}
function confirmFinish(){modal("Submit exam?",`${answers.filter(x=>x!==null).length}/${questions.length} questions answered.`, `<button class="btn ghost" onclick="closeModal()">Continue</button><button class="btn primary" onclick="finish(false)">Submit</button>`)}
async function finish(auto=false){
 clearInterval(timer);timer=null;closeModal();
 try{
  const r=await saveAttempt();lastResult=r;attempts.unshift(r);page="result";render();toast(auto?"Time is up — submitted":"Exam submitted");
 }catch(e){toast("Could not save attempt: "+e.message)}
}

function resultsView(){return `<div class="container"><div class="section"><h2>My Results</h2></div><div class="card">${attempts.length?`<table><tr><th>Exam</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Date</th></tr>${attempts.map(r=>{let e=exams.find(x=>x.id===r.exam_id);return `<tr><td>${esc(r.exam_title||e?.title||"Exam")}</td><td><b>${Number(r.score).toFixed(2)}</b></td><td>${r.correct}</td><td>${r.wrong}</td><td>${new Date(r.submitted_at).toLocaleDateString()}</td></tr>`}).join("")}</table>`:`No attempts yet. Start an exam first.`}</div></div>`}
function resultView(){let r=lastResult;if(!r)return resultsView();return `<div class="container"><div class="card center"><span class="tag">Completed</span><h2>${esc(r.exam_title||exam?.title||"Exam")}</h2><h1>${Number(r.score).toFixed(2)}</h1><div class="grid"><div><b>${r.correct}</b><div class="muted">Correct</div></div><div><b>${r.wrong}</b><div class="muted">Wrong</div></div><div><b>${r.unanswered}</b><div class="muted">Unanswered</div></div><div><b>${Math.round(r.correct/(r.correct+r.wrong+r.unanswered)*100)}%</b><div class="muted">Accuracy</div></div></div><div class="actions"><button class="btn ghost" onclick="go('results')">All Results</button><button class="btn primary" onclick="go('exams')">Take Another</button></div></div></div>`}
function profileView(){return `<div class="container"><div class="card"><h2>${esc(profile?.full_name||user?.user_metadata?.full_name||"Student")}</h2><p class="muted">${esc(user.email)}</p><div class="grid"><div><b>${attempts.length}</b><div class="muted">Completed</div></div><div><b>${attempts.reduce((a,x)=>a+Number(x.correct||0),0)}</b><div class="muted">Correct answers</div></div><div><b>${exams.length}</b><div class="muted">Exams available</div></div><div><b>${profile?.role||"student"}</b><div class="muted">Role</div></div></div><button class="btn danger" onclick="signOut()">Log out</button></div></div>`}
function leaderboard(){return `<div class="container"><div class="section"><h2>Leaderboard</h2></div><div class="card"><p class="muted">Leaderboard will show aggregated public scores after the leaderboard policy/function is enabled in Supabase.</p><p>For privacy, this version does not expose other users' attempts by default.</p></div></div>`}
function adminView(){return `<div class="container"><div class="section"><div><h2>Admin</h2><span class="muted">Create exams and questions from Supabase.</span></div></div><div class="card"><h3>Database connected</h3><p>You are signed in as <b>${esc(profile?.role||"student")}</b>.</p><p class="muted">Admin CRUD can be enabled after secure admin RLS policies are added. Never rely on frontend-only admin checks.</p></div></div>`}

function render(){
 $("nav").innerHTML=nav();
 if(!configured()){$("main").innerHTML=`<div class="container"><div class="card auth"><h2>Supabase setup needed</h2><p>Open this file and replace <b>SUPABASE_URL</b> and <b>SUPABASE_KEY</b> with your project values.</p><p class="muted">Use only the Publishable/Anon key — never the service_role/secret key.</p></div></div>`;return}
 if(!user&&page!=="login"){page="login"} 
 $("main").innerHTML=page==="login"?authView():page==="home"?home():page==="exams"?examsView():page==="exam"?examUI():page==="results"?resultsView():page==="result"?resultView():page==="profile"?profileView():page==="leaderboard"?leaderboard():page==="admin"?adminView():home();
}
boot();
</script>
</body>
  </html>
